name: CI Pipeline
on:
  push:
    branches:
      - development
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Format Check
        run: npm format:check

      - name: Lint
        run: npm lint

      - name: Type Check
        run: npm typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm build

      - name: Docker Build Frontend
        run: docker build -t ./frontend
